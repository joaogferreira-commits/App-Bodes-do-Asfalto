<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Seu avatar — montar com a sua moto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F26B1D}a:hover{color:#FF8A45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0E; color: #F5F1EA; font-family: Inter, system-ui, sans-serif; font-size: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Perfil.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; background: #1C1C1C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5F1EA" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font: 700 28px 'Barlow Condensed', sans-serif">Seu avatar</h1>
  </div>

  <div role="tablist" aria-label="Como criar o avatar" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #1C1C1C; border-radius: 14px; padding: 4px">
    <a role="tab" aria-selected="true" href="AvatarMontar.dc.html" style="height: 44px; border-radius: 10px; background: #F26B1D; color: #111; font: 700 15px Inter; display: flex; align-items: center; justify-content: center; text-decoration: none">Montar</a>
    <a role="tab" aria-selected="false" href="AvatarIA.dc.html" style="height: 44px; border-radius: 10px; color: #F5F1EA; font: 600 15px Inter; display: flex; align-items: center; justify-content: center; text-decoration: none">Criar com IA</a>
  </div>

  <div style="border-radius: 20px; background: #1C1C1C; border: 1px solid #333; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <svg role="img" aria-label="Prévia: seu avatar sobre a moto big trail, na cor escolhida" width="300" height="170" viewBox="0 0 140 80">
      <rect x="0" y="70" width="140" height="10" rx="5" fill="#2A2A2A"></rect>
      <g fill="none" stroke="#E8DCC4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="60" r="12"></circle><circle cx="112" cy="58" r="13"></circle></g>
      <path d="M32 60L48 38H84L100 40L112 58" fill="none" stroke="{{cor}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M58 38q10-8 22 0z" fill="{{cor}}"></path>
      <g fill="none" stroke="#E8DCC4" stroke-width="2.6" stroke-linecap="round"><path d="M104 32l14 8"></path><path d="M100 28L108 16"></path></g>
      <rect x="22" y="30" width="16" height="12" rx="2" fill="#2A2A2A" stroke="#E8DCC4" stroke-width="2"></rect>
      <path d="M76 22l-3 16" stroke="#3A3A3A" stroke-width="7" stroke-linecap="round"></path>
      <path d="M75 26l24 0" stroke="#3A3A3A" stroke-width="4" stroke-linecap="round"></path>
      <circle cx="76" cy="14" r="8" fill="#C68A5E"></circle>
      <path d="M68 13a8 8 0 0116 0z" fill="#F26B1D"></path>
      <path d="M70 16c1 4 3 6 6 6s5-2 6-6c-2 2-4 2-6 2s-4 0-6-2z" fill="#C9C4BC"></path>
    </svg>
    <span style="font: 700 22px 'Barlow Condensed', sans-serif">Honda Africa Twin · 2024</span>
    <span style="color: #B3ADA4; font-size: 13px">Categoria Big Trail · identificada pela Tabela FIPE</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="marca" style="font-size: 13px; color: #B3ADA4; font-weight: 600">Marca</label><input id="marca" value="Honda" style="height: 48px; border-radius: 12px; background: #1C1C1C; border: 1px solid #444; color: #F5F1EA; padding: 0 12px; font: 600 16px Inter"></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="ano" style="font-size: 13px; color: #B3ADA4; font-weight: 600">Ano</label><input id="ano" value="2024" style="height: 48px; border-radius: 12px; background: #1C1C1C; border: 1px solid #444; color: #F5F1EA; padding: 0 12px; font: 600 16px Inter"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px"><label for="modelo" style="font-size: 13px; color: #B3ADA4; font-weight: 600">Modelo (busque entre todos da Tabela FIPE)</label><input id="modelo" value="CRF 1100L Africa Twin Adventure Sports" style="height: 48px; border-radius: 12px; background: #1C1C1C; border: 1px solid #444; color: #F5F1EA; padding: 0 12px; font: 600 15px Inter"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #B3ADA4; font-weight: 600">Cor da moto</span>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{cores}}" as="c" hint-placeholder-count="6">
        <button aria-label="{{c.nome}}" aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="{{c.estilo}}"></button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #B3ADA4; font-weight: 600">Piloto</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 10px 14px; border-radius: 999px; background: #F26B1D; color: #111; font: 700 14px Inter">Bandana</span>
      <span style="padding: 10px 14px; border-radius: 999px; background: #1C1C1C; border: 1px solid #333; font-size: 14px">Capacete aberto</span>
      <span style="padding: 10px 14px; border-radius: 999px; background: #1C1C1C; border: 1px solid #333; font-size: 14px">Barba</span>
      <span style="padding: 10px 14px; border-radius: 999px; background: #1C1C1C; border: 1px solid #333; font-size: 14px">Colete do clube</span>
      <span style="padding: 10px 14px; border-radius: 999px; background: #1C1C1C; border: 1px solid #333; font-size: 14px">Tom de pele</span>
    </div>
  </div>

  <button style="margin-top: auto; height: 56px; border-radius: 14px; background: #F26B1D; border: 0; color: #111; font: 700 18px Inter">Salvar avatar</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cor: '#D7261E' }; }
  renderVals() {
    const base = [
      { nome: 'Vermelha', hex: '#D7261E' },
      { nome: 'Preta', hex: '#2B2B2B' },
      { nome: 'Branca', hex: '#F5F1EA' },
      { nome: 'Azul', hex: '#2B6FBF' },
      { nome: 'Laranja', hex: '#F26B1D' },
      { nome: 'Verde', hex: '#3E7D3A' }
    ];
    const cores = base.map((c) => {
      const on = this.state.cor === c.hex;
      return {
        nome: c.nome,
        sel: on ? 'true' : 'false',
        pick: () => this.setState({ cor: c.hex }),
        estilo: 'width: 44px; height: 44px; border-radius: 50%; cursor: pointer; background: ' + c.hex + '; border: ' + (on ? '3px solid #F26B1D' : '2px solid #555') + '; box-shadow: ' + (on ? '0 0 0 3px #0E0E0E inset' : 'none')
      };
    });
    return { cores, cor: this.state.cor };
  }
}
</script>
</body>
</html>
