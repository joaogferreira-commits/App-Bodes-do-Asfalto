<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Irmão no mapa e aceno</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F26B1D}a:hover{color:#FF8A45}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #151515; color: #F5F1EA; font-family: Inter, system-ui, sans-serif; font-size: 17px">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <path d="M-20 300 C 100 260, 200 360, 420 280" stroke="#2C2C2C" stroke-width="20" fill="none"></path>
    <path d="M200 -20 L 180 420" stroke="#242424" stroke-width="10" fill="none"></path>
  </svg>
  <div style="position: absolute; left: 160px; top: 200px; width: 56px; height: 56px; border-radius: 50%; background: #F26B1D; color: #111; display: flex; align-items: center; justify-content: center; font: 700 18px Inter; border: 4px solid #0E0E0E">ZÉ</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 22px 22px 0 0; background: #1C1C1C; border-top: 1px solid #333; padding: 12px 18px 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #444"></div>
    <div style="display: flex; gap: 14px; align-items: center">
      <div style="width: 68px; height: 68px; border-radius: 50%; background: #F26B1D; color: #111; display: flex; align-items: center; justify-content: center; font: 700 24px Inter">ZÉ</div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font: 700 28px 'Barlow Condensed', sans-serif">Zé Ferreira "Trovão"</span>
        <span style="color: #B3ADA4; font-size: 15px">Capítulo Cuiabá · Bode Velho · Harley Road King</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 6px 10px; border-radius: 8px; background: #F26B1D; color: #111; font-weight: 700; font-size: 14px">Parado para café</span>
      <span style="padding: 6px 10px; border-radius: 8px; background: #2A2A2A; font-size: 14px">a ~4 km</span>
      <span style="padding: 6px 10px; border-radius: 8px; background: #2A2A2A; font-size: 14px">Loja [nome da Loja] · Or. de Cuiabá</span>
    </div>

    <sc-if value="{{naoEnviado}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{acenar}}" style="height: 60px; border-radius: 14px; background: #F26B1D; border: 0; color: #111; font: 700 19px Inter; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6a1.5 1.5 0 013 0v4M10 10V4.5a1.5 1.5 0 013 0V10M13 10V5.5a1.5 1.5 0 013 0V12M16 9.5a1.5 1.5 0 013 0V14a7 7 0 01-7 7h-1a6 6 0 01-5-2.7L3.5 14a1.5 1.5 0 012.4-1.8L7 13.5"></path></svg>
        Acenar para o irmão
      </button>
      <p style="margin: 0; color: #B3ADA4; font-size: 14px; line-height: 1.4; text-align: center">O chat só abre se ele aceitar o aceno.</p>
    </sc-if>
    <sc-if value="{{enviado}}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 14px; background: #2A2A2A; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-weight: 600">Aceno enviado. Mande junto uma resposta rápida:</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button style="min-height: 48px; padding: 0 14px; border-radius: 999px; background: transparent; border: 1px solid #F26B1D; color: #F5F1EA; font: 600 15px Inter">Bora um café?</button>
          <button style="min-height: 48px; padding: 0 14px; border-radius: 999px; background: transparent; border: 1px solid #F26B1D; color: #F5F1EA; font: 600 15px Inter">Onde vocês estão?</button>
          <button style="min-height: 48px; padding: 0 14px; border-radius: 999px; background: transparent; border: 1px solid #F26B1D; color: #F5F1EA; font: 600 15px Inter">Preciso de ajuda</button>
        </div>
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button style="height: 52px; border-radius: 12px; background: transparent; border: 1px solid #555; color: #F5F1EA; font: 600 15px Inter">Ver perfil</button>
      <button style="height: 52px; border-radius: 12px; background: transparent; border: 1px solid #555; color: #F5F1EA; font: 600 15px Inter">Rota até ele</button>
      <button style="height: 52px; border-radius: 12px; background: transparent; border: 1px solid #555; color: #B3ADA4; font: 600 15px Inter">Bloquear</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { enviado: false }; }
  renderVals() {
    return {
      enviado: this.state.enviado,
      naoEnviado: !this.state.enviado,
      acenar: () => this.setState({ enviado: true })
    };
  }
}
</script>
</body>
</html>
