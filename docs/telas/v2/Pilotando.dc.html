<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modo pilotando</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0907}
a{color:#E8692A}a:hover{color:#F0884F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0907; font-family: Inter, system-ui, sans-serif; color: #F3EADB;">

  <!-- Próxima manobra -->
  <div style="position: absolute; top: 44px; left: 12px; right: 12px; background: #E8692A; color: #0B0907; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; gap: 16px;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0B0907" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Vire à direita" role="img"><path d="M7 21V12a4 4 0 014-4h8"></path><path d="M15 4l4 4-4 4"></path></svg>
    <div>
      <div style="font-family: 'Barlow Condensed'; font-weight: 700; font-size: 52px; line-height: 0.95;">800 m</div>
      <div style="font-size: 18px; font-weight: 600; margin-top: 4px;">Direita · BR-163</div>
    </div>
  </div>

  <!-- Mapa -->
  <svg width="390" height="410" viewBox="0 0 390 410" style="position: absolute; top: 168px; left: 0;" aria-hidden="true">
    <rect width="390" height="410" fill="#14110D"></rect>
    <path d="M0 60 C80 40 200 90 390 50" fill="none" stroke="#E9DCC4" stroke-width="4" stroke-opacity="0.5"></path>
    <path d="M300 0 C280 120 320 220 260 410" fill="none" stroke="#5A3E1F" stroke-width="7"></path>
    <path d="M300 0 C280 120 320 220 260 410" fill="none" stroke="#C68A45" stroke-width="3.5" stroke-dasharray="7 6"></path>
    <path d="M195 410 L195 230 C195 200 210 190 240 190 L390 190" fill="none" stroke="#0B0907" stroke-width="16" stroke-linecap="round"></path>
    <path d="M195 410 L195 230 C195 200 210 190 240 190 L390 190" fill="none" stroke="#E8692A" stroke-width="10" stroke-linecap="round"></path>
    <path d="M195 340 l-14 26 h28 z" fill="#F3EADB" stroke="#0B0907" stroke-width="3" stroke-linejoin="round"></path>
    <circle cx="160" cy="300" r="13" fill="#2A2219" stroke="#7FA6C2" stroke-width="3"></circle>
    <text x="160" y="304.5" text-anchor="middle" fill="#F3EADB" font-family="Barlow Condensed" font-size="12" font-weight="700">ED</text>
  </svg>

  <!-- Faixa de status do comboio -->
  <div style="position: absolute; top: 560px; left: 12px; right: 12px; display: flex; gap: 8px;">
    <div style="flex: 1; height: 44px; border-radius: 12px; background: rgba(245,197,24,0.14); border: 1px solid rgba(245,197,24,0.5); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; color: #F5C518;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      Edu ficou para trás · 6 km
    </div>
    <div style="height: 44px; padding: 0 12px; border-radius: 12px; background: #1F1A14; display: flex; align-items: center; font-family: 'Barlow Condensed'; font-weight: 700; font-size: 18px;">5/6</div>
  </div>

  <!-- 6 botões grandes 3×2 -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <button style="height: 112px; border-radius: 18px; border: 0; background: #F5C518; color: #0B0907; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0B0907" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      Alerta
    </button>
    <button style="height: 112px; border-radius: 18px; border: 0; background: #241D17; color: #F3EADB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F3EADB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="2.5"></circle><circle cx="16" cy="9" r="2.5"></circle><path d="M3.5 19a4.5 4.5 0 019 0M11.5 19a4.5 4.5 0 019 0"></path></svg>
      Reagrupar
    </button>
    <button style="height: 112px; border-radius: 18px; border: 0; background: #C62D22; color: #FFF6EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <span style="font-family: 'Barlow Condensed'; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 1px;">SOS</span>
      <span style="font-size: 13px; font-weight: 600; opacity: 0.9;">segure 2 s</span>
    </button>
    <button style="height: 112px; border-radius: 18px; border: 0; background: #241D17; color: #F3EADB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.15;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3FA27A" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 20V5a1 1 0 011-1h7a1 1 0 011 1v15"></path><path d="M4 20h11M7 8h5"></path><path d="M14 10h2l2 2v5a1.5 1.5 0 003 0V9l-3-3"></path></svg>
      Posto<br>próximo
    </button>
    <button style="height: 112px; border-radius: 18px; border: 0; background: #241D17; color: #F3EADB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; line-height: 1.15;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3FA27A" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 20c0-6 12-6 12-12"></path><circle cx="6" cy="20" r="1.5"></circle><circle cx="18" cy="5" r="2.5"></circle></svg>
      Posto<br>na rota
    </button>
    <a href="Main.dc.html" style="height: 112px; border-radius: 18px; border: 1px solid #3A2F25; background: transparent; color: #F3EADB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F3EADB" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      Encerrar
    </a>
  </div>
</div>
</x-dc>
