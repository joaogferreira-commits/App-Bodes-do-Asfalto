name: Verificação (lint, tipos e testes)

# Não roda quando só mudam documentos ou pedidos de build/imagem (economiza os minutos grátis do GitHub).
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'reports/**'
      - 'research_notes/**'
      - '**.md'
      - '!supabase/pendentes/**'
      - '.github/*-request.txt'
      - 'tools/coleta/**'
  pull_request:

# Um push novo cancela a verificação antiga do mesmo ramo (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      banco: ${{ steps.f.outputs.banco }}
      ferramentas: ${{ steps.f.outputs.ferramentas }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'
            banco:
              - 'supabase/**'
              - '.github/workflows/ci.yml'
            ferramentas:
              - 'tools/**'
              - '.github/workflows/ci.yml'

  app:
    needs: mudancas
    if: needs.mudancas.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci --maxWorkers=2 --forceExit
      - name: Empacotar o JavaScript (mesma etapa que roda no EAS)
        run: npx expo export --platform android --output-dir /tmp/export

  ferramentas:
    needs: mudancas
    if: needs.mudancas.outputs.ferramentas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: Testes das ferramentas (conversor de imagens e gerador do estilo do mapa)
        working-directory: tools
        run: python -m unittest

  banco:
    needs: mudancas
    if: needs.mudancas.outputs.banco == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Incluir no teste as migrations que aguardam autorização (só nesta máquina de teste)
        run: |
          for f in supabase/pendentes/*.sql; do
            [ -e "$f" ] || continue
            case "$f" in *.test.sql) cp "$f" supabase/tests/ ;; *) cp "$f" supabase/migrations/ ;; esac
          done
      - name: Banco local (só o Postgres) com as migrations e o seed
        run: supabase db start
      - name: Testes das regras de acesso (pgTAP)
        run: supabase test db
