name: Verificação (lint, tipos e testes)

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Empacotar o JavaScript (mesma etapa que roda no EAS)
        run: npx expo export --platform android --output-dir /tmp/export

  ferramentas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: Testes das ferramentas (conversor de imagens e gerador do estilo do mapa)
        working-directory: tools
        run: python -m unittest
