name: Aplicar o banco no Supabase (só o dono dispara)

# Cria as tabelas, regras de acesso (RLS) e a chave dos dados maçônicos no projeto Supabase do dono.
# Roda quando o dono clica em "Run workflow" ou, com autorização escrita do dono, quando o agente edita
# .github/banco-request.txt (o botão só aparece para workflows do ramo principal). Precisa dos GitHub Secrets:
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD.
on:
  push:
    paths:
      - .github/banco-request.txt
  workflow_dispatch:
    inputs:
      com_capitulos:
        description: 'Cadastrar também a lista inicial de capítulos (seed)? Só na primeira vez.'
        type: boolean
        default: true

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ligar ao projeto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Aplicar as mudanças do banco
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.com_capitulos }}" = "true" ]; then
            supabase db push --linked --include-seed --yes
          else
            supabase db push --linked --yes
          fi
      - name: Conferir
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
