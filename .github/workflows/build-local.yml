name: Versão do app montada no GitHub (sem gastar as builds da Expo)

# O plano grátis da Expo tem poucas builds por mês. Aqui o próprio GitHub monta o app
# ("eas build --local"), usando as mesmas credenciais e variáveis guardadas no EAS.
# Pedido: editar .github/build-local-request.txt (perfil=preview → APK, production → AAB da loja).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/build-local-request.txt

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: Liberar espaço em disco
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/google /usr/local/lib/android/sdk/ndk/2[0-6]* || true
          docker system prune -af >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/trabalho && sudo chown -R "$USER" /mnt/trabalho
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Ler pedido
        id: pedido
        working-directory: .
        run: |
          PERFIL=$(grep -E '^perfil=' .github/build-local-request.txt | cut -d= -f2)
          PERFIL=${PERFIL:-preview}
          echo "perfil=$PERFIL" >> "$GITHUB_OUTPUT"
          if [ "$PERFIL" = "production" ]; then echo "ext=aab" >> "$GITHUB_OUTPUT"; else echo "ext=apk" >> "$GITHUB_OUTPUT"; fi
      - name: Enviar a chave do Google para o EAS (sensível)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            eas env:create --environment ${{ steps.pedido.outputs.perfil }} \
              --name GOOGLE_MAPS_API_KEY --value "$GOOGLE_MAPS_API_KEY" \
              --visibility sensitive --force --non-interactive
          fi
      - name: Memória extra (evita a máquina desligar no meio da montagem)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h
      - name: Conferir o endereço do servidor (sem ele o app vira modo de teste offline)
        env:
          URL_SUPABASE: ${{ secrets.SUPABASE_URL }}
          CHAVE_SUPABASE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL_SUPABASE" ] || [ -z "$CHAVE_SUPABASE" ]; then
            echo "::error::Faltam os segredos SUPABASE_URL e SUPABASE_ANON_KEY no GitHub; o app sairia sem servidor."
            exit 1
          fi
      - name: Gravar o endereço do servidor na configuração da montagem (não vai para o repositório)
        env:
          URL_SUPABASE: ${{ secrets.SUPABASE_URL }}
          CHAVE_SUPABASE: ${{ secrets.SUPABASE_ANON_KEY }}
          DSN_SENTRY: ${{ secrets.SENTRY_DSN }}
        run: |
          P=${{ steps.pedido.outputs.perfil }}
          jq --arg p "$P" --arg u "$URL_SUPABASE" --arg k "$CHAVE_SUPABASE" --arg d "$DSN_SENTRY" \
            '.build[$p].env = ((.build[$p].env // {}) + {EXPO_PUBLIC_SUPABASE_URL:$u, EXPO_PUBLIC_SUPABASE_ANON_KEY:$k, EXPO_PUBLIC_SENTRY_DSN:$d})' \
            eas.json > eas.tmp && mv eas.tmp eas.json
          echo "eas.json preparado para o perfil $P (valores ocultos)."
      - name: Montar o app
        env:
          GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.compiler.execution.strategy=in-process
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          EAS_LOCAL_BUILD_WORKINGDIR: /mnt/trabalho/eas
          GRADLE_USER_HOME: /mnt/trabalho/gradle
          EAS_NO_VCS: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          (while true; do echo "[recursos] $(date +%H:%M) $(free -m | awk '/Mem/{print "mem usada " $3 "/" $2 " MB"}') $(free -m | awk '/Swap/{print "swap " $3 " MB"}') $(df -h / | awk 'NR==2{print "disco livre " $4}')"; sleep 60; done) &
          eas build --local --non-interactive --platform android
          --profile ${{ steps.pedido.outputs.perfil }}
          --output "$GITHUB_WORKSPACE/bodes-do-asfalto.${{ steps.pedido.outputs.ext }}"
      - name: Conferir se o endereço do servidor está DENTRO do app montado
        working-directory: .
        env:
          URL_SUPABASE: ${{ secrets.SUPABASE_URL }}
        run: |
          HOST=$(echo "$URL_SUPABASE" | sed -E 's#https?://##; s#/.*##')
          mkdir -p /mnt/trabalho/confere && cd /mnt/trabalho/confere
          unzip -o -q "$GITHUB_WORKSPACE/bodes-do-asfalto.${{ steps.pedido.outputs.ext }}" 'assets/index.android.bundle' 'base/assets/index.android.bundle' 2>/dev/null || true
          B=$(find . -name index.android.bundle | head -1)
          if [ -n "$B" ] && grep -a -q "$HOST" "$B"; then echo "OK: o app montado conhece o servidor."; else echo "::error::O app montado NÃO tem o endereço do servidor (sairia em modo offline)."; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bodes-do-asfalto-${{ steps.pedido.outputs.perfil }}
          path: bodes-do-asfalto.${{ steps.pedido.outputs.ext }}
          retention-days: 30
