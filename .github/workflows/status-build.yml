name: Situação das versões de teste (EAS)

# O agente não alcança o expo.dev; este workflow lista as últimas builds no log.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/status-request.txt

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Últimas builds
        shell: bash -o pipefail {0}
        run: >
          eas build:list --limit 3 --non-interactive --json
          | jq '.[] | {id, status, platform, buildProfile, createdAt, appBuildVersion,
          erro: .error.message, apk: .artifacts.buildUrl, pagina: ("https://expo.dev/accounts/joaogferreira/projects/bodes-do-asfalto/builds/" + .id)}'
      - name: Registro das builds que falharam
        shell: bash {0}
        run: |
          for id in $(eas build:list --limit 3 --non-interactive --json | jq -r '.[] | select(.status=="ERRORED") | .id' | head -1); do
            echo "=================== BUILD $id ==================="
            eas build:view "$id" --json | jq '{erro: .error}'
            for url in $(eas build:view "$id" --json | jq -r '.logFiles[]?'); do
              curl -sL "$url" | jq -r 'select(.msg != null) | .msg' 2>/dev/null \
                | grep -iE "error|fail|exception|what went wrong|cannot|unresolved|> Task|BUILD FAILED" | tail -120
            done
          done
      - name: Tamanho do APK da última build concluída
        shell: bash {0}
        run: |
          url=$(eas build:list --limit 5 --non-interactive --json | jq -r '[.[] | select(.status=="FINISHED")][0].artifacts.buildUrl')
          echo "APK: $url"
          bytes=$(curl -sIL "$url" | grep -i '^content-length' | tail -1 | tr -dc '0-9')
          echo "TAMANHO_APK_BYTES=$bytes"
          echo "TAMANHO_APK_MB=$(awk "BEGIN {printf \"%.1f\", $bytes/1048576}")"
